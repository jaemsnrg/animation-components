<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmos Study</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-primary); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--button-primary); }
  .stone { fill:var(--gray-200); }
  .lift { fill:var(--bg-elevation); }
  .ash { fill:var(--gray-300); }
  .signal { fill:var(--bg-badge); }
  .hair { fill:none; stroke:var(--border-primary); stroke-width:.5; }
  .card { rx:var(--radius-3xl); }
  .pill16 { rx:8px; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.95; font-weight:400; letter-spacing:-.04em; color:var(--text-primary); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; letter-spacing:-.02em; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      button-primary 176² (the ink: emphasis by inversion) · gray-200 176² bled off the top · bg-elevation 176² bled off top-right · gray-300 176² bled off bottom-right · bg-badge 16px disc once (the only hue, the unread dot) — ≈35% of 960×288
  arrangement a staggered collection grid: four square cards on space-4 gutters, offset by a card-and-a-half like a scrolled masonry wall, bleeding off the top and right
  pattern     pills from "radius-full on every control": space-4-tall caption pills (card title + meta) under the two left cards, a hairline border-primary on the ink card's twin
  scales      card side 176 (11 × space-4), gutters space-4, pills space-4 tall at a space-6 pitch; corners radius-3xl, pills rx = half of space-4
-->
<rect class="stone card" x="0" y="-48" width="176" height="176" rx="24"/>
<rect class="stone pill16" x="0" y="144" width="104" height="16" rx="8"/>
<rect class="ash pill16" x="0" y="168" width="64" height="16" rx="8"/>
<rect class="ink card" x="192" y="16" width="176" height="176" rx="24"/>
<circle class="signal" cx="344" cy="40" r="8"/>
<rect class="stone pill16" x="192" y="208" width="120" height="16" rx="8"/>
<rect class="ash pill16" x="192" y="232" width="72" height="16" rx="8"/>
<rect class="lift card" x="384" y="-96" width="176" height="176" rx="24"/>
<rect class="hair card" x="384" y="-96" width="176" height="176" rx="24"/>
<rect class="ash card" x="384" y="96" width="176" height="176" rx="24"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Cosmos<br>Study</h1>
  <p class="tag">Ink, warm greys and pills. The images bring the colour.</p>
</div>
</div>
</body>
</html>
